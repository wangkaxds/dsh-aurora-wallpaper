<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>we-scene 演示 · Wallpaper Engine 场景浏览器渲染</title>
<style>
  html, body { margin: 0; height: 100%; background: #101012; color: #ddd; font-family: system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; background: #000; }
  #bar { position: fixed; top: 12px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar label { font-size: 13px; background: #222; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #444; }
  #status { font-size: 12px; color: #99aabb; }
</style>
</head>
<body>
<div id="bar">
  <label>选择 scene.pkg<input id="pkg" type="file" hidden></label>
  <label>选择 project.json（可选）<input id="proj" type="file" hidden></label>
  <span id="status">未加载 —— 需要本地服务器：node cli/serve.mjs 后访问 http://localhost:8123/demo/</span>
</div>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<script type="module">
import { parsePkg, getEntry } from '../src/pkg/container.js'
import { parseTex, decodeMip0, decodeMips, FIF } from '../src/pkg/texture.js'
import { parseScene, resolveMaterial } from '../src/scene/parse.js'
import { resolveEffectChain, BUILTIN_MODELS, BUILTIN_MATERIALS } from '../src/scene/effects-parse.js'
import { createRenderer, makeTexture, makeTextureMip } from '../src/render/renderer.js'
import { generateNoiseTexture } from '../src/render/noise.js'

const cv = document.getElementById('cv')
const status = document.getElementById('status')
// shader 源解析：优先 pkg 内（场景自带版本），其次 WE 安装目录（运行时路由，不分发）
function shaderResolver(rel) {
  const inner = rel.startsWith('shaders/') ? rel : 'shaders/' + rel
  const pkgEntry = pkg && getEntry(pkg, inner)
  if (pkgEntry) return Promise.resolve(readText(pkgEntry))
  const file = inner.slice('shaders/'.length)
  return fetch('/we-assets/shaders/' + file, { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : null))
    .catch(() => null)
}
const renderer = createRenderer(cv, { shaderResolver })
const utf8 = new TextDecoder()
function readText(bytes) {
  return utf8.decode(bytes).replace(/^\uFEFF/, '')
}
// 自动化测试钩子（无副作用，供 CDP 验证用）
window.__weScene = { renderer, getScene: () => scene, getTextures: () => textures }

let pkg = null
let project = null
let scene = null
let textures = new Map()
let startTime = 0

document.getElementById('pkg').addEventListener('change', async (ev) => {
  if (!ev.target.files[0]) return
  try {
    status.textContent = '读取文件…'
    pkg = parsePkg(new Uint8Array(await ev.target.files[0].arrayBuffer()))
    await rebuild()
  } catch (e) {
    status.textContent = '❌ 无法解析该文件：' + (e && e.message) + '（确认拖入的是 scene.pkg）'
    console.error(e)
  }
})
document.getElementById('proj').addEventListener('change', async (ev) => {
  if (!ev.target.files[0]) return
  project = JSON.parse(await ev.target.files[0].text())
  await rebuild()
})

async function rebuild() {
  if (!pkg) return
  try {
    status.textContent = '解析中…'
    const sceneEntry = getEntry(pkg, 'scene.json')
    if (!sceneEntry) throw new Error('pkg 里没有 scene.json（这不是场景壁纸文件？）')
    const sj = JSON.parse(readText(sceneEntry))
    scene = parseScene(sj, project)
    textures = new Map()
    const white = { glTex: makeTexture(renderer.gl, new Uint8Array([255, 255, 255, 255]), 1, 1), width: 1, height: 1, rg88: false }
    textures.set('util/white', white)
    // util/noflow：中性流向 0.498 灰 → flowMask=(0,0)
    textures.set('util/noflow', { glTex: makeTexture(renderer.gl, new Uint8Array([127, 127, 127, 255]), 1, 1), width: 1, height: 1, rg88: false })
    // 优先使用壁纸引擎自带 util/noise（由本地服务器路由提供），失败回退合成噪声
    let noiseEntry = { glTex: makeTexture(renderer.gl, generateNoiseTexture(), 256, 256), width: 256, height: 256, rg88: false, mips: null }
    try {
      // 优先 WE 官方 util/noise.tex（带 mip 链，sway 等效果靠 mipmap 平滑位移场）
      const resp = await fetch('/we-assets/noise.tex', { cache: 'no-store' })
      if (resp.ok) {
        const buf = new Uint8Array(await resp.arrayBuffer())
        const ntex = parseTex(buf)
        const mips = decodeMips(ntex)
        noiseEntry = { glTex: makeTextureMip(renderer.gl, mips), width: mips[0].width, height: mips[0].height, rg88: false, mips }
      }
    } catch (e) {
      // 回退合成噪声
    }
    textures.set('util/noise', noiseEntry)
    let n = 0
    async function loadTex(name) {
      if (textures.has(name)) return textures.get(name)
      const texEntry = getEntry(pkg, 'materials/' + name + '.tex')
      if (!texEntry) return null
      const tex = parseTex(texEntry)
      const m = decodeMip0(tex)
      const rg88 = tex.format === 8
      let entry = null
      if (m.video !== undefined) {
        return null
      } else if (m.png !== undefined || (m.image !== undefined && m.fif === FIF.JPEG)) {
        const blob = new Blob([m.png || m.image], { type: m.png ? 'image/png' : 'image/jpeg' })
        const bmp = await createImageBitmap(blob)
        entry = { glTex: makeTexture(renderer.gl, null, 0, 0, bmp), width: bmp.width, height: bmp.height, rg88 }
      } else if (m.image !== undefined) {
        return null
      } else {
        // .tex 纹理带 mip 链：全部上传（LINEAR_MIPMAP_LINEAR，与 WE 一致）
        const mips = decodeMips(tex)
        entry = { glTex: makeTextureMip(renderer.gl, mips), width: mips[0].width, height: mips[0].height, rg88, mips }
      }
      textures.set(name, entry)
      return entry
    }
    for (let li = 0; li < scene.layers.length; li++) {
      const layer = scene.layers[li]
      status.textContent = '加载对象 ' + (li + 1) + '/' + scene.layers.length + '：' + (layer.name || '?')
      if (!layer.image) continue
      try {
        // 内置模型（models/util/*）直接映射；否则读 pkg
        let model
        if (BUILTIN_MODELS[layer.image]) {
          model = BUILTIN_MODELS[layer.image]
        } else {
          const modelEntry = getEntry(pkg, layer.image)
          if (!modelEntry) continue
          model = JSON.parse(readText(modelEntry))
        }
        const mat = resolveMaterial(model)
        if (!mat) continue
        let material
        if (BUILTIN_MATERIALS[mat.materialPath]) {
          material = BUILTIN_MATERIALS[mat.materialPath]
        } else {
          const matEntry = getEntry(pkg, mat.materialPath)
          if (!matEntry) continue
          material = JSON.parse(readText(matEntry))
        }
        const pass = material.passes && material.passes[0]
        const texName = pass && pass.textures && pass.textures[0]
        if (texName) {
          if (textures.has(texName)) {
            layer.textureName = texName
            n++
          } else if (await loadTex(texName)) {
            layer.textureName = texName
            n++
          }
        }
        // 效果 material 链解析（effect.json → materials/effects/*.json）
        for (const e of layer.effects || []) {
          resolveEffectChain(pkg, e, readText)
        }
        // 效果引用纹理（shake 流动图 / waterwaves 蒙版）
        for (const e of layer.effects || []) {
          for (const p of e.passes || []) {
            for (const tn of p.textures || []) {
              if (typeof tn === 'string' && tn !== '' && !tn.startsWith('util/') && !tn.startsWith('_rt_')) {
                await loadTex(tn)
              }
            }
          }
        }
      } catch (e) {
        throw new Error('图层 ' + (layer.name || li) + ' 加载失败: ' + (e && e.message))
      }
    }
    status.textContent = '已加载：' + scene.layers.length + ' 个对象 / ' + n + ' 个纹理（通用 pass 管线）'
    startTime = performance.now()
  } catch (e) {
    status.textContent = '❌ 加载失败：' + (e && e.message) + '（控制台 F12 有详情）'
    console.error(e)
  }
}

let renderErrorShown = false
function frame(now) {
  // 录制工具冻结开关：__weFreeze=true 时 RAF 不渲染（录制脚本自行控制帧）
  if (scene && !window.__weFreeze) {
    const t = (now - startTime) / 1000
    renderer.render(scene, textures, cv.width, cv.height, t).catch((e) => {
      if (!renderErrorShown) {
        renderErrorShown = true
        status.textContent = '❌ 渲染失败：' + (e && e.message) + '（控制台 F12 有详情）'
        console.error(e)
      }
    })
  }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
