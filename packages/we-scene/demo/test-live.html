<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>we-scene 集成原型（模拟 Harness 页面背景注入）</title>
<style>
  html, body { margin: 0; height: 100%; background: #333; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  #ui { position: fixed; top: 12px; left: 12px; color: #eee; font: 13px system-ui; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="scene" width="1920" height="1080"></canvas>
<div id="ui">加载中…</div>
<script type="module">
import {
  parsePkg, getEntry, parseTex, decodeMip0, FIF,
  parseScene, resolveMaterial, createRenderer, makeTexture, generateNoiseTexture,
} from '/lib.js'

const status = document.getElementById('ui')
const renderer = createRenderer(document.getElementById('scene'))
const utf8 = new TextDecoder()
const readText = (b) => utf8.decode(b).replace(/^\uFEFF/, '')

async function main() {
  try {
    const folder = new URLSearchParams(location.search).get('id') || '2884796594'
    status.textContent = '拉取 ' + folder + ' 场景包…'
    const resp = await fetch('/pkg/' + folder, { cache: 'no-store' })
    if (!resp.ok) throw new Error('场景包拉取失败 ' + resp.status)
    const pkg = parsePkg(new Uint8Array(await resp.arrayBuffer()))
    const scene = parseScene(JSON.parse(readText(getEntry(pkg, 'scene.json'))), null)
    const textures = new Map()
    const white = { glTex: makeTexture(renderer.gl, new Uint8Array([255, 255, 255, 255]), 1, 1), width: 1, height: 1, rg88: false }
    textures.set('util/white', white)
    let noiseEntry = { glTex: makeTexture(renderer.gl, generateNoiseTexture(), 256, 256), width: 256, height: 256, rg88: false }
    try {
      const nr = await fetch('/we-assets/noise.png', { cache: 'no-store' })
      if (nr.ok) {
        const bmp = await createImageBitmap(await nr.blob())
        noiseEntry = { glTex: makeTexture(renderer.gl, null, 0, 0, bmp), width: bmp.width, height: bmp.height, rg88: false }
      }
    } catch (e) { /* 回退合成噪声 */ }
    textures.set('util/noise', noiseEntry)

    async function loadTex(name) {
      if (textures.has(name)) return textures.get(name)
      const texEntry = getEntry(pkg, 'materials/' + name + '.tex')
      if (!texEntry) return null
      const tex = parseTex(texEntry)
      const m = decodeMip0(tex)
      const rg88 = tex.format === 8
      if (m.video !== undefined) return null
      if (m.png !== undefined || (m.image !== undefined && m.fif === FIF.JPEG)) {
        const blob = new Blob([m.png || m.image], { type: m.png ? 'image/png' : 'image/jpeg' })
        const bmp = await createImageBitmap(blob)
        const e = { glTex: makeTexture(renderer.gl, null, 0, 0, bmp), width: bmp.width, height: bmp.height, rg88 }
        textures.set(name, e)
        return e
      }
      if (m.image !== undefined) return null
      const e = { glTex: makeTexture(renderer.gl, m.rgba, m.width, m.height), width: m.width, height: m.height, rg88 }
      textures.set(name, e)
      return e
    }

    let n = 0
    for (const layer of scene.layers) {
      if (!layer.image) continue
      try {
        const modelEntry = getEntry(pkg, layer.image)
        if (!modelEntry) continue
        const model = JSON.parse(readText(modelEntry))
        const mat = resolveMaterial(model)
        if (!mat) continue
        const matEntry = getEntry(pkg, mat.materialPath)
        if (!matEntry) continue
        const material = JSON.parse(readText(matEntry))
        const pass = material.passes && material.passes[0]
        const texName = pass && pass.textures && pass.textures[0]
        if (texName) {
          if (textures.has(texName) || await loadTex(texName)) {
            layer.textureName = texName
            n++
          }
        }
        for (const e of layer.effects || []) {
          for (const p of e.passes || []) {
            for (const tn of p.textures || []) {
              if (typeof tn === 'string' && tn !== '' && !tn.startsWith('util/') && !tn.startsWith('_rt_')) await loadTex(tn)
            }
          }
        }
      } catch (e) { /* 跳过 */ }
    }
    status.textContent = '已加载：' + scene.layers.length + ' 个对象 / ' + n + ' 个纹理（' + folder + '）'
    const t0 = performance.now()
    function frame(now) {
      renderer.render(scene, textures, 1920, 1080, (now - t0) / 1000)
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  } catch (e) {
    status.textContent = '❌ ' + (e && e.message)
    console.error(e)
  }
}
main()
</script>
</body>
</html>
